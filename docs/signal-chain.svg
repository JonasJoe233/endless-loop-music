<svg width="100%" viewBox="0 0 900 490" role="img" xmlns="http://www.w3.org/2000/svg">
<title>One signal chain behind both demos</title>
<desc>Offline rendering with tail wrap, synced looping sources, per-stem gains, and per-frame control signals for pointer bend, fixed rate and scene crossfades.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b6b68" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="900" height="490" fill="#f8f7f4"/>
<!-- grid: row1 y=84 h58 | row2 y=210 h62 | row3 y=330 h62 | tags y=412 | legend y=448 ; cols x=37/249/461/673 w=190 -->
<g font-family="'Anthropic Sans','PingFang SC','Hiragino Sans GB',-apple-system,sans-serif">
<text x="37" y="34" font-size="14" font-weight="500" fill="#2c2c2a">One signal chain behind both demos</text>
<text x="37" y="54" font-size="11" fill="#5F5E5A">Balatro's music system and a mouse-reactive homepage use the same Web Audio parts.</text>

<text x="37" y="76" font-size="11" font-weight="500" fill="#3B6D11">1 · Offline, once at load</text>
<rect x="37" y="84" width="190" height="58" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="51" y="108" font-size="12.5" font-weight="500" fill="#27500A">Score or stem files</text>
<text x="51" y="127" font-size="10.5" fill="#3B6D11">notes or DAW exports</text>
<rect x="249" y="84" width="190" height="58" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="263" y="108" font-size="12.5" font-weight="500" fill="#27500A">OfflineAudioContext</text>
<text x="263" y="127" font-size="10.5" fill="#3B6D11">render layers to samples</text>
<rect x="461" y="84" width="190" height="58" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="475" y="108" font-size="12.5" font-weight="500" fill="#27500A">Tail wrap</text>
<text x="475" y="127" font-size="10.5" fill="#3B6D11">add tail onto loop start</text>
<rect x="673" y="84" width="190" height="58" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="687" y="108" font-size="12.5" font-weight="500" fill="#27500A">N AudioBuffers</text>
<text x="687" y="127" font-size="10.5" fill="#3B6D11">same length, same bars</text>
<path d="M229 113H247" fill="none" stroke="#6b6b68" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M441 113H459" fill="none" stroke="#6b6b68" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M653 113H671" fill="none" stroke="#6b6b68" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M768 144V176H300V208" fill="none" stroke="#6b6b68" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="37" y="202" font-size="11" font-weight="500" fill="#185FA5">2 · Runtime audio graph</text>
<rect x="37" y="210" width="300" height="62" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="51" y="236" font-size="12.5" font-weight="500" fill="#0C447C">N looping BufferSources</text>
<text x="51" y="255" font-size="10.5" fill="#185FA5">loop=true, one shared start()</text>
<rect x="377" y="210" width="220" height="62" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="391" y="236" font-size="12.5" font-weight="500" fill="#0C447C">Per-stem GainNode</text>
<text x="391" y="255" font-size="10.5" fill="#185FA5">switch = volume only</text>
<rect x="637" y="210" width="226" height="62" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="651" y="236" font-size="12.5" font-weight="500" fill="#0C447C">Master 0.6 → reverb</text>
<text x="651" y="255" font-size="10.5" fill="#185FA5">→ speakers</text>
<path d="M339 241H375" fill="none" stroke="#6b6b68" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M599 241H635" fill="none" stroke="#6b6b68" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="37" y="322" font-size="11" font-weight="500" fill="#854F0B">3 · Control, per frame</text>
<rect x="37" y="330" width="190" height="62" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="51" y="356" font-size="12.5" font-weight="500" fill="#633806">Pointer Y → ±200¢</text>
<text x="51" y="375" font-size="10.5" fill="#854F0B">dead zone + smoothstep</text>
<rect x="249" y="330" width="190" height="62" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="263" y="356" font-size="12.5" font-weight="500" fill="#633806">rate × PITCH_MOD</text>
<text x="263" y="375" font-size="10.5" fill="#854F0B">0.7, Game Over → 0.5</text>
<rect x="461" y="330" width="190" height="62" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="475" y="356" font-size="12.5" font-weight="500" fill="#633806">Scene / game state</text>
<text x="475" y="375" font-size="10.5" fill="#854F0B">gain target, τ ≈ 0.33 s</text>
<rect x="673" y="330" width="190" height="62" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="687" y="356" font-size="12.5" font-weight="500" fill="#712B13">Score-driven ambient</text>
<text x="687" y="375" font-size="10.5" fill="#993C1D">ignores PITCH_MOD</text>
<path d="M200 328V274" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
<path d="M344 328V300H280V274" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
<path d="M556 328V274" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
<path d="M768 328V274" fill="none" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow-coral)"/>

<text x="51" y="412" font-size="10" fill="#5F5E5A" opacity="0.75">nays.tech · your homepage</text>
<text x="263" y="412" font-size="10" fill="#5F5E5A" opacity="0.75">Balatro</text>
<text x="475" y="412" font-size="10" fill="#5F5E5A" opacity="0.75">Balatro · your homepage</text>
<text x="687" y="412" font-size="10" fill="#5F5E5A" opacity="0.75">Balatro</text>

<path d="M37 446H67" fill="none" stroke="#6b6b68" stroke-width="1.5"/>
<text x="75" y="450" font-size="10.5" fill="#5F5E5A">audio</text>
<path d="M125 446H155" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="163" y="450" font-size="10.5" fill="#5F5E5A">control (changes a parameter, carries no sound)</text>
<path d="M430 446H460" fill="none" stroke="#993C1D" stroke-width="1.5"/>
<text x="468" y="450" font-size="10.5" fill="#5F5E5A">extra audio sources outside the music tracks</text>
</g>
<text x="884" y="479" text-anchor="end" font-family="'PingFang SC','Hiragino Sans GB',sans-serif" font-size="9" fill="#999" opacity="0.65">乔冠宇 Jonas · SVG 架构图 Skill</text>
</svg>
